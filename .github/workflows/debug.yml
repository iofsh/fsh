name: Debug

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java
        uses: ./.github/actions/setup-java

      - name: Set up Android
        uses: ./.github/actions/setup-android

      - name: Set up NDK
        uses: ./.github/actions/setup-ndk

      - name: Set up Gradle
        uses: ./.github/actions/setup-gradle

      - name: Set up Zig
        uses: ./.github/actions/setup-zig

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Zig
        uses: ./.github/actions/cache-zig

      - name: Cache Cargo
        uses: ./.github/actions/cache-cargo

      - name: Check for empty files
        uses: ./.github/actions/check-empty-files

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        uses: ./.github/actions/gradle-build
        with:
          task: ':app:assembleDebug'
          log-file: build.log

      - name: Show failure
        if: failure()
        uses: ./.github/actions/show-failure
        with:
          log-file: build.log

      - name: Upload APK
        if: success()
        uses: ./.github/actions/upload-apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
